name: Validate HScard API
on:
  push:
    paths:
      - '.github/workflows/normalize-card-history.yml'
      - 'cards.json'
      - 'render.json'
      - 'history.json'
      - 'release-policy.json'
      - 'data/**'
      - 'metadata/**'
      - '*-date.json'
      - 'tools/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Generate API indexes with the committed builder
        run: python3 tools/build-api.py
      - name: Validate Blackrock Mountain release and patch history
        run: python3 tools/test-brm-history.py
      - name: Validate all 41 earliest Korean wing rewards and child card dates
        run: python3 tools/test-brm-first-use.py
      - name: Verify all generated cards and Fandral 2016-only forms
        run: python3 tools/test-brm-token-fandral.py
      - name: Validate date schema, preservation and compatibility
        run: |
          python3 tools/test-date-schema.py
          python3 tools/test-brm-mechanics.py
          python3 tools/test-future-canonical.py
          python3 tools/test-legacy-compatibility.py
          python3 tools/test-build-idempotence.py
          python3 tools/test-clean-migration.py
      - name: Verify committed indexes are current
        run: git diff --exit-code -- cards.json render.json history.json cards-date.json render-date.json history-date.json data metadata
